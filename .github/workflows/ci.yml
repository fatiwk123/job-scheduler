name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run lint
        working-directory: dashboard

  test:
    runs-on: ubuntu-latest
    # Redis et PostgreSQL ephemeres pour les tests d'integration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://jobs:jobs@localhost:5432/jobs_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.api, target: runtime, push: false, tags: "job-scheduler-api:ci" }
      - name: Build worker image
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.worker, push: false, tags: "job-scheduler-worker:ci" }
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with: { context: dashboard, push: false, tags: "job-scheduler-dashboard:ci" }
