[project]
name = "job-scheduler"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necessite Redis + PostgreSQL reels"]
filterwarnings = ["ignore::DeprecationWarning:asyncio"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI
